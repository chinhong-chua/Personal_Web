name: Build and deploy to Hostinger

# Hostinger's "Deploy from GitHub" is a plain clone into public_html with no
# build step, so pointing it at master serves an index.html referencing
# /src/main.tsx and renders nothing.
#
# It works fine if the branch it clones is *already built*. So this workflow
# builds here and force-pushes the contents of dist/ to the `deploy` branch,
# whose root is the built site. Hostinger then pulls that branch.
#
# Pushing files to Hostinger directly was the original design, but FTP from
# GitHub's runners times out on the control socket — port 21 is reachable from
# a residential IP and not from Actions, i.e. datacenter ranges are filtered.
# Inverting the direction sidesteps that entirely and needs no credentials.

on:
  push:
    branches: [master]
  workflow_dispatch:

# Never let two deploys write to public_html at once.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Needed to force-push the built output to the deploy branch.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # The invariant this whole setup exists to protect.
      - name: Guard — profile.ts must not be tracked in git
        run: |
          if git ls-files --error-unmatch src/data/profile.ts >/dev/null 2>&1; then
            echo "::error::src/data/profile.ts is tracked. It must stay gitignored."
            exit 1
          fi

      # Real content lives only in a secret, so it is never in the repo,
      # in git history, or in GitHub code search.
      - name: Restore profile.ts from secret
        env:
          PROFILE_TS_B64: ${{ secrets.PROFILE_TS_B64 }}
        run: |
          if [ -z "$PROFILE_TS_B64" ]; then
            echo "::error::PROFILE_TS_B64 is not set (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          printf '%s' "$PROFILE_TS_B64" | base64 -d > src/data/profile.ts
          test -s src/data/profile.ts || { echo "::error::Decoded profile.ts is empty."; exit 1; }

      # `npm run sync:secret` uploads the secret and publishes the same file's
      # sha256 as a readable variable. They should always agree; disagreement
      # means the secret was set by hand or a sync half-completed.
      #
      # Note this proves integrity, not freshness — CI never sees the real
      # local file, so only the pre-push hook can catch "edited but not synced".
      - name: Verify decoded profile.ts against published fingerprint
        env:
          EXPECTED: ${{ vars.PROFILE_TS_SHA256 }}
        run: |
          actual=$(sha256sum src/data/profile.ts | cut -d' ' -f1)
          if [ -z "$EXPECTED" ]; then
            echo "::warning::PROFILE_TS_SHA256 is unset — run 'npm run sync:secret' to publish it."
            exit 0
          fi
          if [ "$actual" != "$EXPECTED" ]; then
            echo "::error::Secret and fingerprint disagree. Expected $EXPECTED, decoded $actual."
            echo "::error::Run 'npm run sync:secret' to reconcile them."
            exit 1
          fi
          echo "Decoded profile.ts matches published fingerprint."

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # index.html carries %VITE_GA_ID%, which Vite substitutes at build time.
      # A repository *variable* rather than a secret: a GA4 measurement ID is
      # served to every visitor in the page source, so it is not confidential,
      # and masking it would only turn a wrong value into *** in these logs.
      - name: Configure analytics
        env:
          GA_ID: ${{ vars.VITE_GA_ID }}
        run: |
          if [ -z "$GA_ID" ]; then
            echo "::warning::VITE_GA_ID is unset — building without analytics."
          fi
          echo "VITE_GA_ID=$GA_ID" > .env.production.local

      - run: npm run build

      # The placeholder surviving the build means the variable never reached
      # Vite, which is silent by design — the tag just never installs. Fail
      # loudly instead, but only when a value was actually supplied.
      - name: Check the analytics ID was substituted
        if: vars.VITE_GA_ID != ''
        env:
          GA_ID: ${{ vars.VITE_GA_ID }}
        run: |
          if grep -q '%VITE_GA_ID%' dist/index.html; then
            echo "::error::VITE_GA_ID was set but dist/index.html still has the placeholder."
            exit 1
          fi
          grep -qF "$GA_ID" dist/index.html \
            || { echo "::error::Measurement ID missing from dist/index.html."; exit 1; }
          echo "Analytics ID substituted into the built output."

      # profile.emailUser/emailDomain are joined at runtime so no address is a
      # literal in the bundle. The contact form's placeholder is the one known
      # exception; anything else means the split has been broken.
      - name: Check bundle for email literals
        run: |
          found=$(grep -rhoE '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}' dist/ \
            | sort -u | grep -vx 'ada@company\.com' || true)
          if [ -n "$found" ]; then
            echo "::error::Unexpected email literals in dist/:"
            echo "$found"
            exit 1
          fi
          echo "Only the known form placeholder present — email split is holding."

      # public/ is gitignored, so static extras are written here rather than
      # committed. Hashed asset names are safe to cache forever; index.html
      # must not be, or visitors keep an app pointing at deleted assets.
      - name: Write .htaccess into dist/
        run: |
          cat > dist/.htaccess <<'HTACCESS'
          <IfModule mod_headers.c>
            <FilesMatch "\.(js|css|woff2)$">
              Header set Cache-Control "public, max-age=31536000, immutable"
            </FilesMatch>
            <FilesMatch "index\.html$">
              Header set Cache-Control "no-cache"
            </FilesMatch>
          </IfModule>

          # Hostinger clones the deploy branch into public_html, which leaves a
          # .git directory in the web root. Nothing secret is in it, but it
          # should not be browsable.
          RedirectMatch 404 /\.git
          HTACCESS

      # A fresh history each time — this branch is build output, not source, so
      # there is nothing worth preserving and no reason to grow it forever.
      # Force-push touches only `deploy`; master is never written to.
      - name: Publish dist/ to the deploy branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: dist
        run: |
          test -f index.html || { echo "::error::dist/index.html missing — refusing to publish."; exit 1; }
          git init -q -b deploy
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Build from ${GITHUB_SHA}"
          git push -q --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" deploy
          echo "Published $(git ls-files | wc -l) files to the deploy branch."
