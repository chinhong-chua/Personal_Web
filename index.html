<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Chua Chin Hong (Cruz) — Staff Software Engineer, Platform Engineering, SRE & Cloud. Portfolio and resume."
    />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>◐</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>Cruz Chua — Staff Software Engineer · Platform, SRE & Cloud</title>
    <script>
      // Apply stored theme before paint to avoid a flash.
      try {
        const t = localStorage.getItem('theme')
        document.documentElement.classList.toggle('dark', t !== 'light')
      } catch {}
    </script>
    <!-- Google tag (gtag.js). Vite substitutes the measurement ID from the
         VITE_GA_ID env var at build time. If it is unset the placeholder is
         left as-is, fails the shape check below, and no tag is installed —
         so an unconfigured build never requests a malformed gtag URL. -->
    <script>
      ;(function () {
        const id = '%VITE_GA_ID%'
        if (!/^G-[A-Z0-9]+$/.test(id)) return
        const s = document.createElement('script')
        s.async = true
        s.src = 'https://www.googletagmanager.com/gtag/js?id=' + id
        document.head.appendChild(s)
        window.dataLayer = window.dataLayer || []
        window.gtag = function () { dataLayer.push(arguments) }
        gtag('js', new Date())
        gtag('config', id)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
